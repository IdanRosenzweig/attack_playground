ssh:
  banner: "Welcome to the Custom ContainerSSH Guest Environment!\n"
  hostkeys:
    - "/etc/containerssh/host.key"

backend: docker

log:
  level: "debug"

docker:
  connection:
    host: "unix:///var/run/docker.sock"
  execution:
    container:
      image: containerssh/agent:latest
      # image: "attack_playground_image:latest"
      # imagePullPolicy: "Never"
      # disableNetworking: false
      cmd: ["/bin/bash"]
      resources:
        memory: 512M

# Simple internal authentication allowing any username/password combination
auth:
  password:
    method: webhook
    webhook:
      url: "http://containerssh-auth:8080/auth"
