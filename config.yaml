ssh:
  hostkeys:
    - "/etc/containerssh/host.key"

backend: docker

log:
  level: "debug"

docker:
  connection:
    host: "unix:///var/run/docker.sock"

  execution:
    # NOTE ON KEY PLACEMENT / CASING (this is what silently broke the restriction):
    # "container" is docker's container.Config, "host" is docker's container.HostConfig.
    # Those docker structs carry no yaml tags, so containerssh (yaml.v3) matches them by
    # the ALL-LOWERCASE go field name ("networkmode", not "networkMode"). Unknown or
    # misplaced keys are silently ignored rather than rejected, so a key in the wrong
    # place is a no-op and the container quietly falls back to the default bridge.
    # Keys that belong to containerssh itself (imagePullPolicy, disableAgent, mode, ...)
    # sit directly under "execution" and keep their documented camelCase spelling.

    container:
      # container.Config
      image: "attack_playground_image:latest"

    host:
      # container.HostConfig.NetworkMode - attaches the guest to the restricted network.
      networkmode: "attack_playground_net"

      # container.HostConfig.ExtraHosts - "<name>:<ip>" pairs docker writes into the
      # guest's /etc/hosts. the entry below is the playground's own name for the
      # bridge gateway, which is the address the attack endpoints are exposed on.
      #
      # this line is where that name is defined, and the only place it is spelled
      # out. the scripts and the verify suite read it back from here through
      # "scripts/render_config.py hostname", so renaming it is an edit to this line
      # alone.
      #
      # a hosts entry rather than a dns record, for three reasons:
      #   * it exists only inside a guest. the host's resolver, the containerssh and
      #     auth containers, and every other container on this daemon are untouched -
      #     nothing outside a guest resolves the name.
      #   * it needs no packets. a guest may only open the tcp ports in
      #     attack_network_endpoints.conf, so a resolver on the gateway would mean
      #     punching udp/53 through the allowlist - and docker's embedded dns must
      #     keep failing, which verify_guest.sh checks. glibc reads "files" before
      #     "dns" (/etc/nsswitch.conf), so this entry answers without a query.
      #   * the guest cannot edit it. with readonlyrootfs docker mounts /etc/hosts
      #     read-only, so the name means the same thing for the whole session.
      #
      # the name is an alias, not a permission: <name>:<port> is allowed exactly when
      # tcp/<port> on the gateway is, so the name on tcp/22 is dropped just like the
      # gateway ip on 22. nothing in the iptables policy knows about the name.
      #
      # __GATEWAY_IP__ is filled in by scripts/render_config.py, which start.sh runs
      # once the network exists - docker picks the subnet when it creates the network,
      # so the gateway address cannot be written down here. containerssh reads the
      # rendered copy (config.runtime.yaml), never this file; see docker-compose.yaml.
      extrahosts:
        - "researchlabs.tech:__GATEWAY_IP__"

      # A guest is an untrusted shell that anyone on the lan can open. Everything
      # below bounds what one guest - or a lan full of them - can cost the host.
      # The concurrency cap itself is an iptables connlimit on the published ssh
      # port (SSH_PORT in .env), see scripts/setup_networking_linux.py.

      # container.HostConfig.ReadonlyRootfs - the image is immutable; the only
      # writable places are the tmpfs mounts below, which are bounded in size and
      # live in memory (counted against the memory limit) rather than in docker's
      # data directory. Without this a single "dd if=/dev/zero" fills the host disk
      # and takes the docker daemon down with it.
      readonlyrootfs: true

      # container.HostConfig.Tmpfs - path -> mount options. guestuser is uid/gid
      # 1000 (first user created in guest_docker.dockerfile).
      tmpfs:
        /home/guestuser: "rw,nosuid,size=256m,uid=1000,gid=1000,mode=0750"
        /tmp: "rw,nosuid,size=64m,mode=1777"
        /var/tmp: "rw,nosuid,size=64m,mode=1777"

      # container.HostConfig.CapDrop - no capabilities at all. Nothing in the
      # guest needs one: ping works through icmp datagram sockets
      # (net.ipv4.ping_group_range, which docker opens up in the container).
      capdrop:
        - "ALL"

      # container.HostConfig.SecurityOpt - setuid binaries in the image cannot
      # regain what was dropped above.
      securityopt:
        - "no-new-privileges"

      # container.HostConfig.Resources (embedded struct -> nested "resources" key).
      # Memory is an int64 in bytes; "512M" would fail to parse here.
      resources:
        memory: 536870912 # 512 MiB
        # same value as memory: no swap on top of it. Left unset docker allows
        # another 512 MiB of swap, and swapping guests is how a host bogs down.
        memoryswap: 536870912
        # a fork bomb stops here rather than at the host's pid_max
        pidslimit: 256
        # one cpu, in units of 1e-9 cpus
        nanocpus: 1000000000

    # containerssh-level options
    imagePullPolicy: "Never"

auth:
  password:
    method: webhook
    webhook:
      url: "http://containerssh-auth:8080/auth"
